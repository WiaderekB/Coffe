<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18271f">
  <meta name="description" content="Kawy, porcje i sprawdzone przepisy. Zawsze pod ręką, także offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moja kawa">
  <meta name="color-scheme" content="dark">
  <title>Moja kawa</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="#" aria-label="Moja kawa — wszystkie kawy"><img class="brand-icon" src="/logo.svg" width="32" height="32" alt="">MOJA KAWA<span class="brand-dot">.</span></a><button id="connection" class="sync-status" data-action="sync" aria-label="Stan synchronizacji">Otwieram…</button></header>
    <main id="app"><p class="loading">Otwieram przepiśnik…</p></main>
    <nav class="bottom-nav" hidden aria-label="Nawigacja"><a href="#" class="nav-home" aria-current="page"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#home"></use></svg><span class="nav-label">Kawy</span></a><button type="button" data-action="add-coffee"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#plus"></use></svg><span class="nav-label">Dodaj kawę</span></button><button type="button" data-action="import"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#upload"></use></svg><span class="nav-label">Import</span></button><button type="button" data-action="settings"><svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#more"></use></svg><span class="nav-label">Więcej</span></button></nav>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title"><div class="dialog-top"><button type="button" class="icon-button" id="close-dialog" aria-label="Zamknij"><svg class="ui-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#close"></use></svg></button></div><div id="editor-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Włącz JavaScript, aby otworzyć przepiśnik i korzystać z niego offline.</noscript>
</body>
</html>
