services:
  coffee:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - coffee-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
volumes:
  coffee-data:
